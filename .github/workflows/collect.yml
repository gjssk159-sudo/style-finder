name: 정기 수집

on:
  schedule:
    - cron: '0 20 * * *'   # 매일 UTC 20:00 = KST 05:00
  workflow_dispatch: {}      # 필요하면 Actions 탭에서 수동 실행도 가능

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 의존성 설치
        run: npm ci

      - name: Playwright 크로미움 설치
        run: npx playwright install --with-deps chromium

      - name: Supabase에서 브랜드 목록 동기화
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env
          node src/process-pending.js
          node src/sync-brands-from-supabase.js

      - name: 전체 수집
        run: node src/run.js

      - name: 분류 재계산
        run: node src/reclassify.js

      - name: Supabase에 적재
        run: node src/load-supabase.js

      - name: 정리
        if: always()
        run: pkill -f chrome || true
