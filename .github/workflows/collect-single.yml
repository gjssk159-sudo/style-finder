name: 브랜드 즉시 수집

# 정기 수집(collect.yml)과 별개로, 사용자가 새 브랜드를 등록한 직후 그 브랜드 하나만
# 바로 수집하기 위한 워크플로우. Supabase Edge Function(register-brand)이 플랫폼 판별
# 직후 이 워크플로우를 트리거해서, 등록부터 검색 가능까지 1~2분 안에 끝나게 한다
# (기존엔 매일 새벽 정기 수집을 기다려야 해서 최대 24시간 가까이 걸렸음).

on:
  workflow_dispatch:
    inputs:
      brand_id:
        description: '수집할 브랜드 id (brands 테이블의 id)'
        required: true

jobs:
  collect-one:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 의존성 설치
        run: npm ci
      - name: Playwright 크로미움 설치
        run: npx playwright install --with-deps chromium
      - name: 브랜드 재판별 + Supabase에서 브랜드 목록 동기화 (방금 등록된 브랜드 포함)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env
          node src/process-pending.js --id=${{ github.event.inputs.brand_id }}
          node src/sync-brands-from-supabase.js
      - name: 이 브랜드만 수집
        run: node src/run.js --source=${{ github.event.inputs.brand_id }}
      - name: 정리
        if: always()
        run: pkill -f chrome || true
      - name: Supabase에 적재 (이 브랜드만)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env
          echo "SUPABASE_SERVICE_KEY=$SUPABASE_SERVICE_KEY" >> .env
          node src/load-supabase.js ${{ github.event.inputs.brand_id }}
