<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MY SELECT SHOP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  * { box-sizing: border-box; }
  :root {
    --ink: #161616; --sub: #8a8a8a; --line: #eaeaea; --bg: #fafaf9; --faint: #f3f2f0;
    --card-shadow: 0 1px 2px rgba(20,20,20,.04);
    --hover-shadow: 0 12px 28px rgba(20,20,20,.10);
  }
  body { margin: 0; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif; font-size: 14px; line-height: 1.5; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  header { position: sticky; top: 0; background: rgba(250,250,249,.82); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); padding: 22px 32px 20px; z-index: 10; }
  .topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .logo { margin: 0; font-family: 'Fraunces', serif; font-size: 25px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
  .spacer { flex: 1; }
  .nav-links { display: flex; gap: 8px; margin-bottom: 18px; }
  .nav-links button { background: #fff; border: 1px solid var(--line); color: var(--ink); font-size: 12.5px; font-weight: 500; letter-spacing: -0.01em; cursor: pointer; padding: 8px 15px; border-radius: 20px; transition: border-color .15s, background .15s; }
  .nav-links button:hover { border-color: var(--ink); background: var(--faint); }
  .nav-links button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .nav-links button.primary:hover { opacity: .85; background: var(--ink); }
  .gender-tabs { display: flex; gap: 22px; margin-bottom: 16px; }
  .gtab { background: none; border: 0; padding: 0 0 7px; font-size: 13.5px; font-weight: 500; color: var(--sub); cursor: pointer; border-bottom: 2px solid transparent; transition: color .15s, border-color .15s; }
  .gtab.active { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .gtab:hover { color: var(--ink); }
  #authArea { font-size: 12.5px; color: var(--sub); display: flex; align-items: center; gap: 10px; }
  #authArea input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 20px; font-size: 12.5px; width: 170px; font-family: inherit; background: #fff; }
  #authArea input:focus { outline: none; border-color: var(--ink); }
  #authArea button { padding: 8px 15px; font-size: 12.5px; border-radius: 20px; }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; cursor: default; }
  button.linklike { background: none; border: 0; color: var(--sub); font-size: 12px; font-weight: 500; padding: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  button.linklike:hover { color: var(--ink); }
  .row { display: flex; gap: 9px; max-width: 1080px; flex-wrap: wrap; align-items: center; }
  .search-wrap { position: relative; flex: 1; min-width: 240px; }
  .search-wrap svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: .4; }
  input[type=text]#q { width: 100%; padding: 13px 16px 13px 40px; border: 1px solid var(--line); border-radius: 11px; font-size: 14.5px; font-family: inherit; background: #fff; box-shadow: var(--card-shadow); transition: box-shadow .15s, border-color .15s; }
  input[type=text]#q:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(22,22,22,.06); }
  input[type=number] { width: 98px; padding: 12px 11px; border: 1px solid var(--line); border-radius: 11px; font-size: 13px; font-family: inherit; background: #fff; }
  .price-range { display: flex; align-items: center; gap: 6px; flex: none; }
  .hsep { color: var(--sub); font-size: 12.5px; }
  select { padding: 12px 11px; border: 1px solid var(--line); border-radius: 11px; font-size: 13px; font-family: inherit; background: #fff; color: var(--ink); max-width: 150px; }
  input[type=number]:focus, select:focus { outline: none; border-color: var(--ink); }
  button { padding: 12px 22px; border: 0; border-radius: 11px; background: var(--ink); color: #fff; font-size: 13.5px; font-weight: 500; font-family: inherit; cursor: pointer; transition: opacity .15s, transform .1s; }
  button:hover { opacity: .82; }
  button:active { transform: scale(.98); }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--sub); white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 16px; max-width: 1080px; }
  .chip { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; background: #fff; font-size: 12.5px; letter-spacing: -0.01em; cursor: pointer; transition: background .12s, color .12s, border-color .12s, box-shadow .12s; }
  .chip:hover { background: var(--ink); color: #fff; border-color: var(--ink); box-shadow: var(--hover-shadow); }
  main { padding: 32px; }
  .meta { max-width: 1320px; margin: 0 auto 20px; color: var(--sub); font-size: 12.5px; letter-spacing: -0.01em; }
  .grid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(204px, 1fr)); gap: 34px 20px; }
  .card { position: relative; display: flex; flex-direction: column; }
  .card .imgwrap { position: relative; overflow: hidden; border-radius: 10px; background: var(--faint); aspect-ratio: 3/4; box-shadow: var(--card-shadow); transition: box-shadow .25s ease; }
  .card:hover .imgwrap { box-shadow: var(--hover-shadow); }
  .card img { width: 100%; height: 100%; aspect-ratio: 3/4; object-fit: cover; display: block; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .card:hover img { transform: scale(1.045); }
  .badge { position: absolute; top: 10px; left: 10px; background: #fff; color: var(--ink); font-size: 10.5px; font-weight: 600; letter-spacing: -0.01em; padding: 4px 9px; border-radius: 6px; box-shadow: var(--card-shadow); }
  .card .body { padding: 13px 2px 0; display: flex; flex-direction: column; gap: 3px; }
  .brand { font-size: 11px; color: var(--sub); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .title { font-size: 13px; font-weight: 500; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .price { font-size: 13.5px; font-weight: 700; margin-top: 4px; letter-spacing: -0.01em; }
  .tags { margin-top: 7px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 10.5px; color: var(--sub); background: var(--faint); border-radius: 5px; padding: 2px 8px; }
  .sold img { opacity: .4; }
  .multi { color: var(--sub); font-size: 11px; margin-top: 4px; }
  a.card { text-decoration: none; color: inherit; }
  .empty { max-width: 1320px; margin: 90px auto; text-align: center; color: var(--sub); line-height: 1.9; font-size: 13.5px; }
  dialog { border: 0; border-radius: 18px; padding: 0; width: min(480px, 92vw); max-height: 80vh; box-shadow: 0 24px 70px rgba(20,20,20,.16); }
  dialog::backdrop { background: rgba(15,15,15,.45); backdrop-filter: blur(2px); }
  .dlg-body { padding: 24px; display: flex; flex-direction: column; gap: 11px; max-height: 80vh; overflow-y: auto; font-family: inherit; }
  .dlg-body h2 { margin: 0 0 4px; font-size: 17px; letter-spacing: -0.02em; font-weight: 700; }
  .dlg-body input { padding: 12px 14px; border: 1px solid var(--line); border-radius: 11px; font-size: 14px; font-family: inherit; background: var(--faint); }
  .dlg-body input:focus { outline: none; border-color: var(--ink); background: #fff; }
  .dlg-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
  .dlg-row button.secondary { background: var(--faint); color: var(--ink); }
  .dlg-row button.secondary:hover { opacity: 1; background: var(--line); }
  .more-wrap { max-width: 1320px; margin: 36px auto 0; text-align: center; }
  .more-wrap button.secondary { background: #fff; color: var(--ink); padding: 13px 30px; border: 1px solid var(--line); box-shadow: var(--card-shadow); }
  .more-wrap button.secondary:hover { opacity: 1; background: var(--faint); }
  #addResult, #folderMsg { font-size: 12.5px; padding: 10px 12px; border-radius: 9px; display: none; }
  #addResult.ok, #folderMsg.ok { display: block; background: #eef7ee; color: #2a6b2a; }
  #addResult.warn { display: block; background: #fdf3e7; color: #92400e; }
  .folderList { display: flex; flex-direction: column; gap: 2px; max-height: 50vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 11px; padding: 6px; }
  .folderRow { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .folderRow:hover { background: var(--faint); }
  .folderRow .fname { flex: 1; }
  .folderRow .fbrand { color: #a1a1aa; font-size: 11px; }
</style></head><body>
<header>
  <div class="topbar">
    <p class="logo">MY SELECT SHOP</p>
    <span class="spacer"></span>
    <span id="authArea"></span>
  </div>
  <div class="nav-links">
    <button onclick="folderDialog.showModal(); renderFolderList()">내 폴더</button>
    <button class="primary" onclick="addDialog.showModal()">+ 브랜드 등록</button>
  </div>
  <div class="gender-tabs" id="genderTabs">
    <button class="gtab active" data-gender="" onclick="setGender('')">전체</button>
    <button class="gtab" data-gender="women" onclick="setGender('women')">여성</button>
    <button class="gtab" data-gender="men" onclick="setGender('men')">남성</button>
    <button class="gtab" data-gender="unisex" onclick="setGender('unisex')">공용</button>
  </div>
  <div class="row">
    <div class="search-wrap">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="q" placeholder="찾고 싶은 아이템을 검색해보세요" autofocus>
    </div>
    <select id="color"><option value="">색상 전체</option></select>
    <select id="size"><option value="">사이즈 전체</option></select>
    <select id="brand"><option value="">브랜드 전체</option></select>
    <div class="price-range">
      <input type="number" id="priceMin" placeholder="최소가">
      <span class="hsep">~</span>
      <input type="number" id="priceMax" placeholder="최대가">
    </div>
    <label class="chk"><input type="checkbox" id="inStock">품절 제외</label>
    <button onclick="go()">검색</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main><div class="meta" id="meta"></div><div class="grid" id="grid"></div>
<div class="more-wrap" id="moreWrap" style="display:none">
  <button class="secondary" id="moreBtn" onclick="loadMore()">더 보기</button>
</div>
</main>

<dialog id="addDialog">
  <div class="dlg-body">
    <h2>브랜드 등록</h2>
    <p style="font-size:13px;color:#71717a;margin:0">이미 등록된 브랜드면 바로 내 폴더에 추가되고, 새 브랜드면 자동으로 판별해서 등록 + 추가돼요.</p>
    <input type="text" id="addUrl" placeholder="쇼핑몰 URL (예: brand.com)">
    <input type="text" id="addName" placeholder="표시 이름 (선택)">
    <input type="text" id="addInstagram" placeholder="인스타 핸들 (선택)">
    <div id="addResult"></div>
    <div class="dlg-row">
      <button class="secondary" onclick="addDialog.close()">닫기</button>
      <button onclick="submitAdd()">등록 + 내 폴더에 추가</button>
    </div>
  </div>
</dialog>

<dialog id="folderDialog">
  <div class="dlg-body">
    <h2>내 폴더</h2>
    <p style="font-size:13px;color:#71717a;margin:0">체크한 브랜드만 검색에 포함돼요.</p>
    <input type="text" id="folderSearch" placeholder="브랜드 검색…" oninput="renderFolderList()">
    <div id="folderMsg"></div>
    <div class="folderList" id="folderList"></div>
    <div class="dlg-row">
      <button class="secondary" onclick="folderDialog.close(); go()">닫기</button>
    </div>
  </div>
</dialog>

<script src="./taxonomy-client.js"></script>
<script src="./config.js"></script>
<script src="./app.js"></script>
</body></html>
