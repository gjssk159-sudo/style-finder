<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>#20 대시보드 시안 B+움직임</title><style>
:root{--ink:#111;--sub:#75716a;--paper:#fff;--faint:#eeece6;--accent:#2fbf8f;--accent-ink:#177656;--accent-bg:#e6f7f0;--bg:#f3f4f3}
*{box-sizing:border-box} body{margin:0;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:#f3f4f3;color:var(--ink);word-break:keep-all}
h2{font-size:15px;margin:22px 24px 10px;color:#444}
.wrap{padding:0 24px} .track{display:flex;gap:12px}
.card{position:relative;flex:none;width:346px;height:300px;border-radius:24px;overflow:hidden;background:var(--tint);padding:18px 18px 16px;display:flex;flex-direction:column;isolation:isolate}
.card.pc{width:1200px;height:400px;padding:44px 48px;flex-direction:row;gap:30px}
.ghost{display:none;position:absolute;left:-6px;bottom:52px;z-index:0;font-size:112px;font-weight:800;letter-spacing:-.05em;line-height:.8;color:transparent;-webkit-text-stroke:1.5px color-mix(in srgb,var(--ink) 12%,transparent);white-space:nowrap;pointer-events:none}
.pc .ghost{display:block;font-size:220px;left:-14px;right:auto;bottom:-34px}
.txt{position:relative;z-index:3} .txt small{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--sub)}
.txt b{display:block;margin-top:3px;font-size:30px;font-weight:700;letter-spacing:-.03em;line-height:1.05}
.txt span .count{display:inline} .txt span{display:block;margin-top:6px;font-size:13px;color:#4a4844;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .txt{flex:0 0 32%;display:flex;flex-direction:column;justify-content:flex-end} .pc .txt b{font-size:60px} .pc .txt span{font-size:15px;white-space:normal}
.n{position:absolute;top:14px;right:14px;z-index:5;font-size:12px;font-weight:600;padding:3px 9px;border-radius:11px;background:rgba(255,255,255,.85)}
/* 상품: 둥실 떠 있고 바닥 그림자가 같이 움직임 */
.stage{position:relative;z-index:2;margin-top:auto;height:150px;display:flex;gap:6px;align-items:flex-end}
.pc .stage{flex:1;height:100%;gap:18px}
.item{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:0;transform:translateX(40px)}
.item .fl{flex:1;min-height:0;width:100%;background:var(--tint);display:flex;align-items:flex-end;justify-content:center;animation:bob 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*-1.1s)}
.item img{max-width:100%;max-height:100%;object-fit:contain;mix-blend-mode:multiply}
.item .sh{width:62%;height:8px;margin-top:4px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.18),transparent);animation:shadow 3.6s ease-in-out infinite;animation-delay:calc(var(--i)*-1.1s)}
.item i{margin-top:5px;font-style:normal;font-size:10px;font-weight:600;letter-spacing:.03em;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.pc .item i{font-size:12px}
.item:nth-child(2){transform:translateX(40px)}
.card.on .item{animation:enter .7s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--i)*.12s + .1s)}
.card.on .txt b{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-7px) rotate(var(--r,0deg))}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.78);opacity:.6}}
/* 겨울: 눈 */
.snow{position:absolute;inset:0;z-index:1;pointer-events:none}
.snow i{position:absolute;top:-10px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(0,0,0,.08);animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),330px)}}
.pc .snow i{animation-name:fallpc} @keyframes fallpc{to{transform:translate(var(--dx),430px)}}
/* 신상: 도는 도장 + 숫자 올라가기 */
.stamp{position:absolute;right:16px;top:44px;z-index:4;width:78px;height:78px;animation:spin 12s linear infinite}
.pc .stamp{width:110px;height:110px;right:auto;left:300px;top:44px}
.stamp text{font-size:11px;font-weight:700;letter-spacing:2.4px;fill:var(--ink)}
.stamp .dot{fill:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}
.count{font-variant-numeric:tabular-nums}
/* For You: 취향 일치 원 */
.match{position:absolute;right:16px;top:44px;z-index:4;width:72px;height:72px}
.pc .match{width:96px;height:96px;right:auto;left:48px;top:40px}
.match circle{fill:none;stroke-width:6} .match .bgc{stroke:rgba(0,0,0,.07)} .match .fg{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:201;stroke-dashoffset:201;transform:rotate(-90deg);transform-origin:50% 50%}
.card.on .match .fg{animation:fill 1.4s cubic-bezier(.2,.8,.2,1) .3s forwards}
@keyframes fill{to{stroke-dashoffset:var(--off)}}
.match b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;font-weight:700} .pc .match b{font-size:22px}
.card:has(.stamp) .txt,.card:has(.match) .txt{padding-right:84px} .pc .txt{padding-right:0!important} .match small{position:absolute;left:0;right:0;bottom:-16px;text-align:center;font-size:10px;color:var(--sub);font-weight:600}
/* AI: 스캔 빛줄기 */
.scan{position:absolute;z-index:3;left:0;right:0;height:46px;top:-50px;background:linear-gradient(to bottom,transparent,rgba(47,191,143,.28),transparent);border-bottom:2px solid rgba(47,191,143,.8);animation:scan 2.6s ease-in-out infinite}
@keyframes scan{0%{top:-50px}70%,100%{top:100%}}
.dots{position:absolute;z-index:4;inset:0;pointer-events:none}
.dots i{position:absolute;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px rgba(47,191,143,.18);opacity:0;animation:ping 2.6s ease-out infinite}
@keyframes ping{0%,30%{opacity:0;transform:scale(.4)}45%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.3)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important} .item{opacity:1;transform:none} .match .fg{stroke-dashoffset:var(--off)}}
</style></head><body>

const px = (u) => { const x = new URL(u); return 'https://i' + (u.length % 3) + '.wp.com/' + x.host + x.pathname + x.search + (x.search ? '&' : '?') + 'w=640&quality=82&strip=all'; };
function isPackshot(img){try{const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d');g.drawImage(img,0,0,24,24);const d=g.getImageData(0,0,24,24).data;let ok=0,all=0;for(let y=0;y<24;y++)for(let x=0;x<24;x++){if(x>3&&x<20&&y>3&&y<20)continue;const i=(y*24+x)*4;const r=d[i],gg=d[i+1],b=d[i+2];all++;if(Math.min(r,gg,b)>240&&Math.max(r,gg,b)-Math.min(r,gg,b)<10)ok++;}return ok/all>=.88;}catch{return false}}
const load=(r)=>new Promise((ok)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>ok(im.naturalWidth>=200&&isPackshot(im)?{r,src:im.src}:null);im.onerror=()=>ok(null);im.src=px(r.image);setTimeout(()=>ok(null),9000)});
const CARDS=[

 {k:'fresh',tint:'#fff',ghost:'NEW',eb:'이번 주 신상',t:'New In',s:'이번 주 내 폴더에 <span class=count data-to=128>0</span>개 새로 들어왔어요',extra:'stamp'},

];
const extra=(e)=>e==='snow'?'<div class=snow>'+Array.from({length:22},(_,i)=>'<i style="left:'+(i*4.6%100)+'%;--dx:'+((i%5)-2)*10+'px;animation-duration:'+(5+(i%4))+'s;animation-delay:-'+(i*.37).toFixed(2)+'s;transform:scale('+(.5+(i%3)*.25)+')"></i>').join('')+'</div>'
 :e==='stamp'?'<svg class=stamp viewBox="0 0 100 100"><defs><path id=cp d="M50 50 m-38 0 a38 38 0 1 1 76 0 a38 38 0 1 1 -76 0"/></defs><text><textPath href="#cp">NEW IN · THIS WEEK · NEW IN · THIS WEEK ·</textPath></text><circle class=dot cx=50 cy=50 r=9 /></svg>'

const card=(c,list,pc)=>{const n=pc?4:3;const pick=list.slice(0,n);return '<div class="card '+(pc?'pc':'')+'" style="--tint:'+c.tint+'"><div class=ghost>'+c.ghost+'</div>'+(c.extra==='snow'?extra('snow'):'')+'<i class=n>'+(CARDS.indexOf(c)+1)+'/4</i>'+(c.extra!=='snow'?extra(c.extra):'')+'<div class=txt><small>'+c.eb+'</small><b>'+c.t+'</b><span>'+c.s+'</span></div><div class=stage>'+pick.map((p,i)=>'<div class=item style="--i:'+i+';--r:'+[-3,2,-1,3][i]+'deg"><div class=fl><img crossorigin=anonymous onerror="this.parentNode.parentNode.remove()" src="'+p.src+'"></div><div class=sh></div><i>'+p.r.brand+'</i></div>').join('')+'</div></div>';};
const countUp=(root)=>root.querySelectorAll('.count').forEach((el)=>{const to=+el.dataset.to;const t0=performance.now();const f=(t)=>{const k=Math.min(1,(t-t0)/1200);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)});
(async()=>{
 const got={};for(const k of Object.keys(DATA))got[k]=(await Promise.all(DATA[k].map(load))).filter(Boolean);
 document.getElementById('m').innerHTML=CARDS.map((c)=>card(c,got[c.k],false)).join('');
 const p=document.getElementById('p');
 const cards=[...document.querySelectorAll('#m .card')];
 cards.forEach((c,i)=>setTimeout(()=>{c.classList.add('on');countUp(c)},300+i*400));
 let idx=0;const showPc=()=>{p.innerHTML=card(CARDS[idx],got[CARDS[idx].k],true);const c=p.firstChild;requestAnimationFrame(()=>{c.classList.add('on');countUp(c)});idx=(idx+1)%4};showPc();setInterval(showPc,5000);
 document.body.dataset.ready=Object.values(got).map((l)=>l.length).join(',');
})();
