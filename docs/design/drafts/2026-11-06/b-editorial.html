<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 B — 매거진(굵고 힘 있게)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* 시안 B: 패션 매거진. 큰 제목·굵은 글자·강한 흑백 대비, 포인트 색 하나(주황빨강). 첫 상품은 크게. */
:root{--ink:#0d0d0d;--sub:#5c5c5c;--pt:#e8431a;--line:#0d0d0d}
*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:14px;line-height:1.45;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;padding-bottom:86px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:2px solid var(--line)}
.logo{font-size:20px;font-weight:900;letter-spacing:-.04em}
.logo i{color:var(--pt);font-style:normal}
.search{display:flex;align-items:center;gap:8px;margin:14px 16px 0;padding:12px 14px;background:#f1f1f1;font-size:15px;color:var(--sub)}
.hero{padding:22px 16px 8px}
.date{font-size:12px;font-weight:700;color:var(--pt);letter-spacing:.06em}
.hero h1{margin:6px 0 0;font-size:34px;line-height:1.12;font-weight:900;letter-spacing:-.04em}
.hero p{margin:8px 0 0;color:var(--sub);font-size:13px}
.folder{display:flex;justify-content:space-between;align-items:center;margin:14px 16px 0;padding:10px 0;border-top:1px solid #ddd;border-bottom:1px solid #ddd;font-size:13px}
.folder b{font-weight:800}
.folder a{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.cats{display:flex;gap:16px;overflow-x:auto;padding:16px 16px 0;scrollbar-width:none}
.cats span{flex:none;font-size:20px;font-weight:900;letter-spacing:-.03em;color:#c4c4c4}
.cats span.on{color:var(--ink)}
.tools{display:flex;gap:6px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}
.tools span{flex:none;border:1.5px solid var(--ink);padding:6px 12px;font-size:12.5px;font-weight:700}
.tools span.on{background:var(--ink);color:#fff}
.big{margin:0 16px}
.big .img{aspect-ratio:4/5;position:relative}
.tag{position:absolute;left:0;top:0;background:var(--pt);color:#fff;font-size:12px;font-weight:800;padding:6px 10px}
.big .t{padding:10px 0 20px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.big .brand{font-size:13px;font-weight:900}
.big .name{font-size:18px;font-weight:800;line-height:1.25;letter-spacing:-.02em;margin-top:2px}
.big .price{font-size:18px;font-weight:900;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 10px;margin:0 16px}
.card .img{aspect-ratio:3/4;position:relative}
.card .brand{font-size:12px;font-weight:900;margin-top:8px}
.card .name{font-size:13px;margin-top:1px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .price{font-size:14px;font-weight:900;margin-top:4px}
.sale{color:var(--pt);margin-right:4px}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--line)}
nav .in{max-width:430px;margin:0 auto;display:flex;justify-content:space-around;align-items:center;padding:10px 0 16px;font-size:12px;font-weight:800}
nav .plus{background:var(--pt);color:#fff;padding:8px 14px}
nav .off{color:#9b9b9b}
</style></head><body><div class="wrap">
<header><span class="logo">MY SELECT<i>.</i></span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></header>
<div class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>찾고 싶은 아이템을 검색해보세요</div>
<section class="hero"><div class="date">MY FOLDER</div><h1>내 폴더 브랜드의<br>상품 128개</h1><p>브랜드 5곳 · 매일 새벽 새로 모아요.</p></section>
<div class="folder"><span><b>내 폴더</b> · 온결, 무드랩, 소요 외 2</span><a>관리</a></div>
<div class="cats"><span class="on">ALL</span><span>TOP</span><span>OUTER</span><span>BOTTOM</span><span>DRESS</span><span>BAG</span></div>
<div class="tools"><span class="on">브랜드순</span><span>필터</span><span>색상</span><span>사이즈</span><span>품절 제외</span></div>
<div class="big"><div class="img" style="background:linear-gradient(170deg,#b4a593,#7c6d5c)"></div><div class="t"><div><div class="brand">온결</div><div class="name">울 블렌드 오버핏 싱글 코트</div></div><div class="price">₩189,000</div></div></div>
<div class="grid" id="grid"></div>
</div>
<nav><div class="in"><span>홈</span><span class="off">AI</span><span class="plus">+ 브랜드</span><span class="off">내 폴더</span><span class="off">마이</span></div></nav>
<script>
const P=[['무드랩','코튼 와이드 데님 팬츠 워시드 블루','79,000',0,'#7d95ad','#4f677f'],['소요','라운드넥 캐시미어 니트 오트밀','129,000',0,'#ddd3c0','#bfb29b'],['헤이든','레더 미니 숄더백','98,000',1,'#7a5a48','#4e3528'],['파인스튜디오','헤비 코튼 후드 집업 차콜','89,000',0,'#55595e','#2f3236']];
document.getElementById('grid').innerHTML=P.map(p=>`<div class="card"><div class="img" style="background:linear-gradient(170deg,${p[4]},${p[5]})">${p[3]?'<span class="tag" style="background:#0d0d0d">품절</span>':''}</div><div class="brand">${p[0]}</div><div class="name">${p[1]}</div><div class="price">₩${p[2]}</div></div>`).join('');
</script></body></html>
