<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시안 C — 쇼핑앱(밝고 친근하게)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
/* 시안 C: 친근한 쇼핑앱. 둥근 흰 카드, 지금 쓰는 초록 포인트, 할인·찜 같은 쇼핑 신호를 잘 보이게. */
:root{--bg:#f3f4f6;--ink:#17181a;--sub:#6b7076;--green:#17a477;--green-weak:#e3f6ee;--sale:#e5484d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Pretendard Variable',Pretendard,sans-serif;font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
.wrap{max-width:430px;margin:0 auto;padding-bottom:96px}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 10px}
.logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;letter-spacing:-.02em}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--green);display:inline-block}
.bell{width:38px;height:38px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.search{display:flex;align-items:center;gap:8px;margin:4px 16px 0;padding:13px 16px;background:#fff;border-radius:14px;color:var(--sub);font-size:15px;box-shadow:0 1px 2px rgb(0 0 0 / .05)}
.folder{margin:12px 16px 0;padding:14px 16px;background:var(--green-weak);border-radius:16px;display:flex;justify-content:space-between;align-items:center}
.folder b{font-size:15px}
.folder small{display:block;color:#3f6b5a;font-size:12.5px;margin-top:2px}
.folder a{background:var(--green);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px}
.cats{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 0;scrollbar-width:none}
.cats span{flex:none;background:#fff;border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;color:var(--sub)}
.cats span.on{background:var(--ink);color:#fff}
.tools{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 10px;font-size:13px}
.tools b{font-weight:700}
.tools span{color:var(--sub)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 16px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 1px 3px rgb(0 0 0 / .06)}
.card .img{aspect-ratio:1/1.15;position:relative}
.heart{position:absolute;right:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgb(255 255 255 / .9);display:flex;align-items:center;justify-content:center}
.badge{position:absolute;left:8px;top:8px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px}
.card .t{padding:10px 12px 14px}
.brand{font-size:12px;color:var(--sub);font-weight:600}
.name{font-size:13.5px;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}
.price{font-size:15.5px;font-weight:800;margin-top:6px}
.sale{color:var(--sale);margin-right:4px}
.ship{font-size:11.5px;color:var(--sub);margin-top:3px}
nav{position:fixed;left:12px;right:12px;bottom:12px;max-width:406px;margin:0 auto;background:#fff;border-radius:22px;box-shadow:0 4px 18px rgb(0 0 0 / .1)}
nav .in{display:flex;justify-content:space-around;align-items:center;padding:10px 0;font-size:11.5px;color:var(--sub);font-weight:600}
nav .in span{display:flex;flex-direction:column;align-items:center;gap:2px}
nav .on{color:var(--ink)}
nav .plus{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;font-size:26px;font-weight:400;justify-content:center;margin-top:-26px;box-shadow:0 4px 10px rgb(23 164 119 / .35)}
</style></head><body><div class="wrap">
<header><span class="logo"><i></i>MY SELECT SHOP</span><span class="bell"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg></span></header>
<div class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>찾고 싶은 아이템을 검색해보세요</div>
<div class="folder"><div><b>내 폴더</b><small>브랜드 5곳이 담겨 있어요</small></div><a>브랜드 담기</a></div>
<div class="cats"><span class="on">전체</span><span>상의</span><span>아우터</span><span>바지</span><span>원피스·스커트</span><span>가방</span></div>
<div class="tools"><span>상품 <b style="color:var(--ink)">128</b>개</span><span><b>브랜드순 ▾</b> &nbsp;·&nbsp; 필터</span></div>
<div class="grid" id="grid"></div>
</div>
<nav><div class="in"><span class="on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/></svg>홈</span><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2 2M16 16l2 2M6 18l2-2M16 8l2-2"/></svg>AI</span><span class="plus">+</span><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h7l2 2h9v11H3z"/></svg>내 폴더</span><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>마이</span></div></nav>
<script>
const P=[['온결','울 블렌드 오버핏 싱글 코트','189,000',0,'#b4a593','#8c7d6c',''],['무드랩','코튼 와이드 데님 팬츠 워시드 블루','79,000',0,'#7d95ad','#4f677f',''],['소요','라운드넥 캐시미어 니트 오트밀','129,000',0,'#ddd3c0','#bfb29b',''],['헤이든','레더 미니 숄더백','98,000',0,'#7a5a48','#4e3528','품절'],['파인스튜디오','헤비 코튼 후드 집업 차콜','89,000',0,'#55595e','#2f3236',''],['온결','스트라이프 옥스퍼드 셔츠','69,000',0,'#d5dee5','#aab8c3','']];
const heart='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#17181a" stroke-width="2"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 5.5-7 10-7 10z"/></svg>';
document.getElementById('grid').innerHTML=P.map(p=>`<div class="card"><div class="img" style="background:linear-gradient(170deg,${p[4]},${p[5]})">${p[6]?`<span class="badge">${p[6]}</span>`:''}</div><div class="t"><div class="brand">${p[0]}</div><div class="name">${p[1]}</div><div class="price">${p[3]?`<span class="sale">${p[3]}%</span>`:''}${p[2]}원</div><div class="ship">아우터</div></div></div>`).join('');
</script></body></html>
