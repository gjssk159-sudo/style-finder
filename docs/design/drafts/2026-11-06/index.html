<style>
body{margin:0;background:#e9e9e9;font-family:'Pretendard Variable',Pretendard,'Malgun Gothic',sans-serif;color:#111;word-break:keep-all}
h1{font-size:20px;margin:20px 24px 4px}

<h1>마이셀렉트샵 리뉴얼 — 첫 화면 시안</h1>
<p class="lead">왼쪽이 지금 화면, 오른쪽 3개가 시안입니다. 시안 화면 안은 손가락(마우스 휠)으로 아래로 내려 볼 수 있어요. 기능과 정보는 모두 지금과 같고 모양만 다릅니다.</p>
<div class="row">
  <div class="col"><h2>지금</h2><p>현재 사이트(가짜 상품 데이터로 찍은 사진)</p><div class="phone"><img src="now.png" alt="지금 화면"></div></div>
  <div class="col"><h2>A 갤러리</h2><p>조용한 편집숍. 카드·그림자 없이 사진이 주인공, 글자는 작고 차분하게.</p><div class="phone"><iframe src="a-gallery.html" title="시안 A"></iframe></div></div>
  <div class="col"><h2>B 매거진</h2><p>패션 잡지. 큰 제목·굵은 글자, 흑백에 주황빨강 포인트 하나, 첫 상품을 크게.</p><div class="phone"><iframe src="b-editorial.html" title="시안 B"></iframe></div></div>
  <div class="col"><h2>C 쇼핑앱</h2><p>밝고 친근한 앱. 둥근 흰 카드, 지금 초록색 유지, 분류도 한글로.</p><div class="phone"><iframe src="c-friendly.html" title="시안 C"></iframe></div></div>
</div>
