<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>#20 대시보드 시안 — 사진 띠형</title><style>
:root{--ink:#111;--paper:#fff;--accent:#2fbf8f;--mint:#8ee7c3}
*{box-sizing:border-box} body{margin:0;font-family:Pretendard,-apple-system,"Malgun Gothic",sans-serif;background:#f3f4f3;color:var(--ink);word-break:keep-all}
h2{font-size:15px;margin:22px 24px 10px;color:#444}
.wrap{padding:0 24px} .track{display:flex;gap:12px}
.card{position:relative;flex:none;width:346px;height:316px;border-radius:24px;overflow:hidden;background:var(--bgc,#111);color:#fff;display:flex;flex-direction:column;isolation:isolate}
.card.pc{width:1200px;height:420px;flex-direction:row-reverse}
/* 사진 띠: 3:4 칸이 옆으로 천천히 흘러감(끝없이) */
.strip{position:relative;height:178px;margin:12px 0 0;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent)}
.pc .strip{flex:1;height:auto;margin:28px 0;}
.belt{display:flex;gap:8px;width:max-content;animation:belt var(--dur,26s) linear infinite}
.card:hover .belt{animation-play-state:paused}
@keyframes belt{to{transform:translateX(-50%)}}
.tile{position:relative;flex:none;width:134px;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#222}
.pc .tile{width:273px;border-radius:18px}
.tile img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.tile i{position:absolute;left:8px;bottom:8px;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.04em;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);color:#fff;max-width:calc(100% - 16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .tile i{font-size:12px;left:12px;bottom:12px}
/* 글자 칸 */
.txt{position:relative;z-index:3;flex:1;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto 1fr;column-gap:12px;align-content:end;padding:12px 18px 16px}
.pc .txt{flex:0 0 36%;padding:40px 8px 40px 44px;align-content:end}
.idx{grid-row:1/3;font-size:48px;font-weight:800;line-height:.9;letter-spacing:-.04em;color:transparent;-webkit-text-stroke:1.5px var(--mint);align-self:end}
.pc .idx{grid-row:auto;grid-column:1/3;font-size:110px;margin-bottom:14px;-webkit-text-stroke:2px var(--mint)}
.txt small{align-self:end;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--mint)}
.txt b{font-size:30px;font-weight:800;letter-spacing:-.035em;line-height:1}
.pc .txt small{grid-column:1/3;font-size:14px} .pc .txt b{grid-column:1/3;font-size:62px;margin-top:4px}
.txt .sub{grid-column:1/3;margin-top:8px;font-size:13px;color:rgba(255,255,255,.78);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .txt .sub{font-size:16px;white-space:normal}
.chip{position:absolute;z-index:4;top:22px;left:24px;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:rgba(17,17,17,.55);backdrop-filter:blur(8px);font-size:11.5px;font-weight:700}
.pc .chip{left:auto;right:28px;top:40px;font-size:13px}
.chip em{font-style:normal;color:var(--mint)}
.live::before{content:'';width:7px;height:7px;border-radius:50%;background:#ff5b4f;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.n{display:none;position:absolute;top:22px;right:20px;z-index:4;font-size:11px;font-weight:700;letter-spacing:.1em;color:rgba(255,255,255,.6)}
.pc .n{display:block;top:auto;bottom:40px;right:auto;left:calc(36% - 70px)}
/* 등장: 번호·제목이 아래에서 올라옴 */
.idx,.txt small,.txt b,.txt .sub{opacity:0;transform:translateY(14px)}
.card.on .idx{animation:up .7s cubic-bezier(.2,.8,.2,1) forwards}
.card.on .txt small{animation:up .7s cubic-bezier(.2,.8,.2,1) .08s forwards}
.card.on .txt b{animation:up .7s cubic-bezier(.2,.8,.2,1) .16s forwards}
.card.on .txt .sub{animation:up .7s cubic-bezier(.2,.8,.2,1) .26s forwards}
@keyframes up{to{opacity:1;transform:none}}
/* 카드별 효과 */
.snow{position:absolute;inset:0;z-index:2;pointer-events:none}
.snow i{position:absolute;top:-8px;border-radius:50%;background:#fff;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),440px)}}
.scan{position:absolute;z-index:2;top:0;bottom:0;width:60px;left:-70px;background:linear-gradient(to right,transparent,rgba(142,231,195,.45));border-right:2px solid var(--mint);box-shadow:6px 0 18px rgba(47,191,143,.45);animation:scan 3.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes scan{0%{left:-70px}80%,100%{left:105%}}
@media (prefers-reduced-motion: reduce){*{animation:none!important} .idx,.txt small,.txt b,.txt .sub{opacity:1;transform:none}}
</style></head><body>

function isPackshot(img){try{const c=document.createElement('canvas');c.width=c.height=24;const g=c.getContext('2d');g.drawImage(img,0,0,24,24);const d=g.getImageData(0,0,24,24).data;let ok=0,all=0;for(let y=0;y<24;y++)for(let x=0;x<24;x++){if(x>3&&x<20&&y>3&&y<20)continue;const i=(y*24+x)*4;const r=d[i],gg=d[i+1],b=d[i+2];all++;if(Math.min(r,gg,b)>232&&Math.max(r,gg,b)-Math.min(r,gg,b)<12)ok++;}return ok/all>=.6;}catch{return true}}
const load=(r)=>new Promise((ok)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{const a=im.naturalHeight/im.naturalWidth;ok(im.naturalWidth>=200&&a>=1.15&&a<=1.6&&!isPackshot(im)?{r,src:px(r.image,640)}:null)};im.onerror=()=>ok(null);im.src=px(r.image,240);setTimeout(()=>ok(null),9000)});
const CARDS=[
 {k:'you',bg:'#111',eb:'myname님을 위한',t:'For You',s:'SAFARISPOT · POLYTERU · XLIM — 취향이 비슷한 브랜드',chip:'<div class=chip>취향 일치 <em>87%</em></div>'},
 {k:'winter',bg:'#13202a',eb:'11월 · 방한템',t:'Winter Pick',s:'패딩·플리스·니트, 내 폴더에서 312개',fx:'snow'},
 {k:'fresh',bg:'#111',eb:'이번 주 신상',t:'New In',s:'내 폴더에 128개 새로 들어왔어요',chip:'<div class="chip live">LIVE · 방금 들어온 상품</div>'},
 {k:'ai',bg:'#0f2a22',eb:'사진 한 장으로',t:'AI Finder',s:'마음에 든 옷, 내 폴더에서 비슷한 것 찾기',fx:'scan'},
];
const fx=(x)=>x==='snow'?'<div class=snow>'+Array.from({length:30},(_,i)=>{const s=(2+(i%3)*1.6).toFixed(1);return '<i style="left:'+((i*37)%100)+'%;width:'+s+'px;height:'+s+'px;--dx:'+(((i%5)-2)*12)+'px;animation-duration:'+(6+(i%5))+'s;animation-delay:-'+(i*.41).toFixed(2)+'s"></i>'}).join('')+'</div>':x==='scan'?'<div class=scan></div>':'';
const card=(c,list,pc)=>{const tiles=list.slice(0,6);const belt=tiles.concat(tiles).map((p)=>'<div class=tile><img crossorigin=anonymous src="'+p.src+'" onerror="this.parentNode.remove()"><i>'+p.r.brand+'</i></div>').join('');const i=CARDS.indexOf(c)+1;
 return '<div class="card '+(pc?'pc':'')+'" style="--bgc:'+c.bg+'"><div class=strip>'+(c.fx?fx(c.fx):'')+'<div class=belt style="--dur:'+(pc?34:24)+'s">'+belt+'</div></div>'+(c.chip||'')+'<span class=n>'+String(i).padStart(2,'0')+' / 04</span><div class=txt><span class=idx>0'+i+'</span><small>'+c.eb+'</small><b>'+c.t+'</b><span class=sub>'+c.s+'</span></div></div>';};
(async()=>{
 const got={};for(const k of Object.keys(DATA))got[k]=(await Promise.all(DATA[k].map(load))).filter(Boolean);
 document.getElementById('m').innerHTML=CARDS.map((c)=>card(c,got[c.k],false)).join('');
 [...document.querySelectorAll('#m .card')].forEach((c,i)=>setTimeout(()=>c.classList.add('on'),300+i*350));
 const p=document.getElementById('p');let idx=1;
 const show=()=>{p.innerHTML=card(CARDS[idx],got[CARDS[idx].k],true);requestAnimationFrame(()=>p.firstChild.classList.add('on'));idx=(idx+1)%4};show();setInterval(show,6000);
 document.body.dataset.ready=Object.values(got).map((l)=>l.length).join(',');
})();
</script></body></html>
